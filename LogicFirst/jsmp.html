
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Mini Cricket Game</h2>

    <H3 id="score">Score : </H3>
    <h3 id="result">Select your runs!</h3>

    <button onclick="play(1)">1 Run</button>
    <button onclick="play(2)">2 Run</button>
    <button onclick="play(3)">3 Run</button>
    <button onclick="play(4)">4 Run</button>
    <button onclick="play(5)">5 Run</button>
    <button onclick="play(6)">6 Run</button>

    <script>
        let score=0;


        function play(run){
            let computer =Math.floor(Math.random()*6)+1;

            if(run===computer){
                document.getElementById("result").innerHTML="OUT !";

            }

            else{
                score =score+run;

                document.getElementById("result").innerHTML="computer"+ computer+"<br> Good Shot !";

            }
            document.getElementById("score").innerHTML="Score :"+score;
        }
    </script>
