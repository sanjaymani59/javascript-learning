<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
    </style>
</head>
<body>
    <h1> click game  </h1>
    
    <p id="score">score :0 </p>

    <button onclick="play()"> click me </button>

    <script>
        let score=0;

        function play(){
            score++;
            document.getElementsByName("score").innerHTML="score: " +score;
        }
    </script>

</body>
</html>
