<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        javaScript
    </title>
</head>
<body>
    <h2 id="like">0</h2>
    <button onclick="like()">like</button>

    <button onclick="Delete()">delete</button>
    <script>
    let count=0;

    function like() {
        count++;
        show();
       
       
    }

    function Delete() {
        if(count>0){
            count--;
        }
        show();
    }

    function show(){
        document.getAnimations("like").innerHTML="()()"+count;
    }
    </script>
    
</body>
</html>
